<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học Từ Vựng Tiếng Anh - Flashcard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #333;
        }

        .container {
            width: 100%;
            max-width: 520px;
            text-align: center;
        }

        h1 {
            color: white;
            margin-bottom: 10px;
            font-size: 1.8rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        /* --- GIAO DIỆN MENU --- */
        #menu-view {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: left;
            max-height: 85vh;
            overflow-y: auto;
        }

        .menu-section {
            margin-bottom: 20px;
        }

        .menu-section h2 {
            font-size: 1.1rem;
            color: #4c51bf;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 5px;
            margin-bottom: 12px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .menu-btn {
            background: #f7fafc;
            color: #2d3748;
            border: 1px solid #e2e8f0;
            padding: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
            box-shadow: none;
        }

        .menu-btn:hover {
            background: #4c51bf;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* --- GIAO DIỆN FLASHCARD --- */
        #flashcard-view {
            display: none; /* Ẩn mặc định, chỉ hiện khi chọn chủ đề */
        }

        .card-container {
            perspective: 1000px;
            width: 100%;
            height: 260px;
            margin-bottom: 25px;
            cursor: pointer;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            padding: 20px;
            background: white;
        }

        .card-front { background: #ffffff; }
        .card-back {
            background: #f8f9fa;
            transform: rotateY(180deg);
        }

        .word {
            font-size: 2.2rem;
            font-weight: bold;
            color: #2d3748;
            margin-bottom: 10px;
        }

        .meaning {
            font-size: 1.6rem;
            color: #4a5568;
            margin-bottom: 10px;
        }

        .phonetic {
            font-size: 1.1rem;
            color: #718096;
            font-style: italic;
        }

        .hint {
            position: absolute;
            bottom: 15px;
            font-size: 0.85rem;
            color: #a0aec0;
        }

        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 20px;
        }

        button {
            background: white;
            color: #4c51bf;
            border: none;
            padding: 12px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        .btn-back-menu {
            background: #e2e8f0;
            color: #4a5568;
            margin-top: 10px;
        }
        .btn-back-menu:hover {
            background: #cbd5e0;
            color: #2d3748;
        }

        .progress {
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.95rem;
            font-weight: 500;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Flashcard Từ Vựng</h1>
        <div class="subtitle" id="current-topic-title">Chọn chủ đề để bắt đầu học</div>

        <div id="menu-view">
            <div class="menu-section">
                <h2>1. Từ vựng thông dụng hằng ngày</h2>
                <div class="menu-grid">
                    <button class="menu-btn" onclick="selectTopic('giadinh.txt', 'Gia đình')">👪 Gia đình</button>
                    <button class="menu-btn" onclick="selectTopic('anuong.txt', 'Ăn uống')">🍔 Ăn uống</button>
                    <button class="menu-btn" onclick="selectTopic('congviec.txt', 'Công việc')">💼 Công việc</button>
                    <button class="menu-btn" onclick="selectTopic('camxuc.txt', 'Cảm xúc')">❤️ Cảm xúc</button>
                    <button class="menu-btn" onclick="selectTopic('thoigian.txt', 'Thời gian')">⏰ Thời gian</button>
                    <button class="menu-btn" onclick="selectTopic('nhacua.txt', 'Nhà cửa')">🏠 Nhà cửa</button>
                </div>
            </div>

            <div class="menu-section">
                <h2>2. Từ vựng theo chủ đề</h2>
                <div class="menu-grid">
                    <button class="menu-btn" onclick="selectTopic('cntt.txt', 'Công nghệ thông tin')">💻 Công nghệ TT</button>
                    <button class="menu-btn" onclick="selectTopic('xeco.txt', 'Xe cộ')">🚗 Xe cộ</button>
                    <button class="menu-btn" onclick="selectTopic('dulich.txt', 'Du lịch')">✈️ Du lịch</button>
                    <button class="menu-btn" onclick="selectTopic('yhoc.txt', 'Y học')">🏥 Y học</button>
                    <button class="menu-btn" onclick="selectTopic('phapluat.txt', 'Pháp luật')">⚖️ Pháp luật</button>
                    <button class="menu-btn" onclick="selectTopic('kinhdoanh.txt', 'Kinh doanh')">📊 Kinh doanh</button>
                    <button class="menu-btn" onclick="selectTopic('thethao.txt', 'Thể thao')">⚽ Thể thao</button>
                    <button class="menu-btn" onclick="selectTopic('taichinh.txt', 'Tài chính')">💰 Tài chính</button>
                </div>
            </div>

            <div class="menu-section">
                <h2>3. Từ vựng nâng cao theo trình độ</h2>
                <div class="menu-grid">
                    <button class="menu-btn" onclick="selectTopic('easy.txt', 'Trình độ Easy (A1-A2)')">🌱 Easy (A1–A2)</button>
                    <button class="menu-btn" onclick="selectTopic('medium.txt', 'Trình độ Medium (B1-B2)')">📈 Medium (B1–B2)</button>
                    <button class="menu-btn" onclick="selectTopic('hard.txt', 'Trình độ Hard (C1)')">🔥 Hard (C1)</button>
                </div>
            </div>
        </div>

        <div id="flashcard-view">
            <div class="card-container" onclick="flipCard()">
                <div class="card" id="card">
                    <div class="card-face card-front">
                        <div class="word" id="front-word">Loading...</div>
                        <div class="phonetic" id="front-phonetic"></div>
                        <div class="hint">Chạm để xem nghĩa 🔄</div>
                    </div>
                    <div class="card-face card-back">
                        <div class="meaning" id="back-meaning">...</div>
                        <div class="hint">Chạm để xem từ 🔄</div>
                    </div>
                </div>
            </div>

            <div class="controls">
                <button onclick="prevWord()">⬅ Trước</button>
                <button onclick="speakWord()">🔊 Phát âm</button>
                <button onclick="nextWord()">Tiếp ➡</button>
            </div>

            <div class="progress" id="progress">0 / 0</div>
            <button class="btn-back-menu" onclick="backToMenu()">⬅ Quay lại Menu</button>
        </div>
    </div>

    <script>
        let vocabulary = [];
        let currentIndex = 0;
        const card = document.getElementById('card');
        
        // Danh sách từ dự phòng phòng khi file .txt bị lỗi/không tìm thấy
        const fallbackWords = [
            { word: "example", phonetic: "/ɪɡˈzæm.pəl/", meaning: "Từ mẫu (File .txt chưa tải được)" }
        ];

        function speakWord() {
            if (vocabulary.length === 0) return;
            const text = vocabulary[currentIndex].word;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            window.speechSynthesis.speak(utterance);
        }

        function flipCard() {
            card.classList.toggle('flipped');
        }

        function updateCard() {
            card.classList.remove('flipped');
            setTimeout(() => {
                if (vocabulary.length > 0) {
                    const item = vocabulary[currentIndex];
                    document.getElementById('front-word').innerText = item.word;
                    document.getElementById('front-phonetic').innerText = item.phonetic || '';
                    document.getElementById('back-meaning').innerText = item.meaning;
                    document.getElementById('progress').innerText = `Từ ${currentIndex + 1} / ${vocabulary.length}`;
                }
            }, 150);
        }

        function nextWord() {
            if (vocabulary.length === 0) return;
            currentIndex = (currentIndex + 1) % vocabulary.length;
            updateCard();
        }

        function prevWord() {
            if (vocabulary.length === 0) return;
            currentIndex = (currentIndex - 1 + vocabulary.length) % vocabulary.length;
            updateCard();
        }

        function parseTextToVocab(text) {
            const lines = text.split('\n');
            const parsed = [];

            lines.forEach(line => {
                const trimmed = line.trim();
                if (!trimmed) return;

                const parts = trimmed.split('-').map(p => p.trim());
                if (parts.length >= 2) {
                    if (parts.length === 2) {
                        parsed.push({ word: parts[0], phonetic: '', meaning: parts[1] });
                    } else {
                        parsed.push({ word: parts[0], phonetic: parts[1], meaning: parts[2] });
                    }
                }
            });

            return parsed;
        }

        // Hàm xử lý khi người dùng click vào một chủ đề
        async function selectTopic(fileName, topicName) {
            document.getElementById('current-topic-title').innerText = `Chủ đề: ${topicName}`;
            
            try {
                // Tải file .txt tương ứng từ thư mục
                let response = await fetch(fileName);
                if (response.ok) {
                    const text = await response.text();
                    const parsedData = parseTextToVocab(text);
                    if(parsedData.length > 0) {
                        vocabulary = parsedData;
                    } else {
                        alert("File txt trống hoặc sai định dạng Từ - Nghĩa");
                        vocabulary = fallbackWords;
                    }
                } else {
                    alert(`Không tìm thấy file "${fileName}" trong thư mục! Hãy tạo file này.`);
                    vocabulary = fallbackWords;
                }
            } catch (e) {
                alert("Lỗi: Không thể fetch file. Hãy đảm bảo bạn đang chạy ứng dụng qua Live Server / Web Server.");
                vocabulary = fallbackWords;
            }

            // Chuyển giao diện từ Menu sang Flashcard
            currentIndex = 0;
            document.getElementById('menu-view').style.display = 'none';
            document.getElementById('flashcard-view').style.display = 'block';
            updateCard();
        }

        // Quay lại màn hình chọn Menu
        function backToMenu() {
            document.getElementById('current-topic-title').innerText = 'Chọn chủ đề để bắt đầu học';
            document.getElementById('flashcard-view').style.display = 'none';
            document.getElementById('menu-view').style.display = 'block';
        }
    </script>
</body>
</html>
