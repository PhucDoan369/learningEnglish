<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học Từ Vựng Trực Tuyến - API Flashcard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #333;
        }

        .container {
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        h1 {
            color: white;
            margin-bottom: 10px;
            font-size: 1.8rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        p.subtitle {
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        /* Khung Tìm Kiếm Từ Mới */
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-box input {
            flex: 1;
            padding: 12px 15px;
            border-radius: 12px;
            border: none;
            outline: none;
            font-size: 1rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .search-box button {
            background: #4c51bf;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.2s;
        }

        .search-box button:hover {
            background: #434190;
        }

        /* Thẻ Flashcard */
        .card-container {
            perspective: 1000px;
            width: 100%;
            height: 260px;
            margin-bottom: 25px;
            cursor: pointer;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            padding: 25px;
            background: white;
        }

        .card-front {
            background: #ffffff;
        }

        .card-back {
            background: #f8f9fa;
            transform: rotateY(180deg);
        }

        .word {
            font-size: 2.4rem;
            font-weight: bold;
            color: #2d3748;
            margin-bottom: 10px;
        }

        .meaning {
            font-size: 1.3rem;
            color: #4a5568;
            line-height: 1.5;
            max-height: 160px;
            overflow-y: auto;
        }

        .phonetic {
            font-size: 1.2rem;
            color: #718096;
            font-style: italic;
        }

        .hint {
            position: absolute;
            bottom: 15px;
            font-size: 0.85rem;
            color: #a0aec0;
        }

        /* Nút Điều Hướng */
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .btn-ctrl {
            background: white;
            color: #4c51bf;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
        }

        .btn-ctrl:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        .btn-ctrl:active {
            transform: translateY(0);
        }

        .progress {
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.95rem;
            font-weight: 500;
            margin-bottom: 20px;
        }

        /* Danh Sách Lịch Sử Đã Học */
        .history-panel {
            background: rgba(255, 255, 255, 0.15);
            padding: 15px;
            border-radius: 16px;
            backdrop-filter: blur(5px);
            max-height: 150px;
            overflow-y: auto;
            text-align: left;
        }

        .history-title {
            color: white;
            font-size: 0.9rem;
            margin-bottom: 10px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }

        .history-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .history-item {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .history-item:hover {
            background: rgba(255, 255, 255, 0.4);
        }
        
        .clear-btn {
            background: none;
            border: none;
            color: #feb2b2;
            cursor: pointer;
            font-size: 0.8rem;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Flashcard API</h1>
        <p class="subtitle">Nhập từ vựng để tra nghĩa và học trực tuyến</p>

        <div class="search-box">
            <input type="text" id="wordInput" placeholder="Nhập từ tiếng Anh... (Ví dụ: success)" onkeypress="handleKeyPress(event)">
            <button onclick="addNewWord()">Thêm</button>
        </div>

        <div class="card-container" onclick="flipCard()">
            <div class="card" id="card">
                <div class="card-face card-front">
                    <div class="word" id="front-word">Nhập một từ</div>
                    <div class="phonetic" id="front-phonetic">để bắt đầu học nhé!</div>
                    <div class="hint">Chạm để xem nghĩa 🔄</div>
                </div>
                <div class="card-face card-back">
                    <div class="meaning" id="back-meaning">Nghĩa tiếng Anh của từ sẽ xuất hiện tại đây.</div>
                    <div class="hint">Chạm để xem từ 🔄</div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="btn-ctrl" onclick="prevWord()">⬅ Trước</button>
            <button class="btn-ctrl" onclick="speakWord()">🔊 Phát âm</button>
            <button class="btn-ctrl" onclick="nextWord()">Tiếp ➡</button>
        </div>

        <div class="progress" id="progress">Danh sách trống</div>

        <div class="history-panel">
            <div class="history-title">
                <span>Từ vựng đã lưu:</span>
                <button class="clear-btn" onclick="clearHistory()">Xóa hết</button>
            </div>
            <div class="history-list" id="history-list">
                </div>
        </div>
    </div>

    <script>
        // Lấy danh sách từ cũ đã lưu trong máy người dùng (nếu có), nếu không có thì khởi tạo danh sách mặc định
        let vocabulary = JSON.parse(localStorage.getItem('my_vocab_list')) || [
            { word: "success", phonetic: "/səkˈses/", meaning: "The accomplishment of an aim or purpose.", audio: "https://api.dictionaryapi.dev/media/pronunciations/en/success-us.mp3" },
            { word: "dream", phonetic: "/driːm/", meaning: "A series of thoughts, images, and sensations occurring in a person's mind during sleep.", audio: "" }
        ];

        let currentIndex = 0;
        const card = document.getElementById('card');

        // Hàm gọi API lấy dữ liệu từ
        async function fetchWordDetails(word) {
            try {
                const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word.toLowerCase().trim()}`);
                if (!response.ok) throw new Error('Không tìm thấy từ này');
                
                const data = await response.json();
                const wordData = data[0];

                // Lấy phiên âm
                const phonetic = wordData.phonetic || (wordData.phonetics && wordData.phonetics[0] ? wordData.phonetics[0].text : '');
                
                // Lấy nghĩa
                const meaning = wordData.meanings[0].definitions[0].definition;

                // Lấy âm thanh chuẩn
                let audioUrl = '';
                const audioObj = wordData.phonetics.find(p => p.audio && p.audio !== '');
                if (audioObj) audioUrl = audioObj.audio;

                return {
                    word: wordData.word,
                    phonetic: phonetic || '/.../',
                    meaning: meaning,
                    audio: audioUrl
                };
            } catch (error) {
                alert(`Không tìm thấy từ "${word}" hoặc API gặp sự cố. Vui lòng kiểm tra lại chính tả.`);
                return null;
            }
        }

        // Thêm từ mới từ ô input
        async function addNewWord() {
            const input = document.getElementById('wordInput');
            const word = input.value.trim();
            if (!word) return;

            // Tránh trùng lặp từ đã có
            const exists = vocabulary.findIndex(item => item.word.toLowerCase() === word.toLowerCase());
            if (exists !== -1) {
                currentIndex = exists;
                updateCard();
                input.value = '';
                return;
            }

            document.getElementById('front-word').innerText = "Searching...";
            document.getElementById('front-phonetic').innerText = "";

            const details = await fetchWordDetails(word);
            if (details) {
                vocabulary.push(details);
                // Lưu vào LocalStorage để không bị mất khi F5
                localStorage.setItem('my_vocab_list', JSON.stringify(vocabulary));
                
                currentIndex = vocabulary.length - 1; // Nhảy ngay tới từ vừa tạo
                updateCard();
                renderHistory();
            } else {
                updateCard();
            }
            input.value = '';
        }

        // Cho phép ấn Enter để tìm kiếm
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                addNewWord();
            }
        }

        // Phát âm từ
        function speakWord() {
            if (vocabulary.length === 0) return;
            const current = vocabulary[currentIndex];

            if (current.audio) {
                const audio = new Audio(current.audio);
                audio.play().catch(() => {
                    speakWithSpeechSynthesis(current.word);
                });
            } else {
                speakWithSpeechSynthesis(current.word);
            }
        }

        function speakWithSpeechSynthesis(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            window.speechSynthesis.speak(utterance);
        }

        // Cập nhật giao diện Flashcard
        function updateCard() {
            card.classList.remove('flipped');
            setTimeout(() => {
                if (vocabulary.length > 0) {
                    const item = vocabulary[currentIndex];
                    document.getElementById('front-word').innerText = item.word;
                    document.getElementById('front-phonetic').innerText = item.phonetic;
                    document.getElementById('back-meaning').innerText = item.meaning;
                    document.getElementById('progress').innerText = `Từ ${currentIndex + 1} / ${vocabulary.length}`;
                } else {
                    document.getElementById('front-word').innerText = "Trống";
                    document.getElementById('front-phonetic').innerText = "Vui lòng nhập từ mới";
                    document.getElementById('back-meaning').innerText = "Không có dữ liệu.";
                    document.getElementById('progress').innerText = "Danh sách trống";
                }
            }, 150);
        }

        // Vẽ danh sách lịch sử ở dưới
        function renderHistory() {
            const listEl = document.getElementById('history-list');
            listEl.innerHTML = '';
            vocabulary.forEach((item, index) => {
                const span = document.createElement('span');
                span.className = 'history-item';
                span.innerText = item.word;
                span.onclick = () => {
                    currentIndex = index;
                    updateCard();
                };
                listEl.appendChild(span);
            });
        }

        // Xóa sạch lịch sử học
        function clearHistory() {
            if (confirm("Bạn có chắc chắn muốn xóa toàn bộ lịch sử từ vựng?")) {
                vocabulary = [];
                localStorage.removeItem('my_vocab_list');
                currentIndex = 0;
                updateCard();
                renderHistory();
            }
        }

        function nextWord() {
            if (vocabulary.length === 0) return;
            currentIndex = (currentIndex + 1) % vocabulary.length;
            updateCard();
        }

        function prevWord() {
            if (vocabulary.length === 0) return;
            currentIndex = (currentIndex - 1 + vocabulary.length) % vocabulary.length;
            updateCard();
        }

        function flipCard() {
            card.classList.toggle('flipped');
        }

        // Khởi chạy khi vào trang
        window.onload = () => {
            updateCard();
            renderHistory();
        }
    </script>
</body>
</html>
