<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học Từ Vựng Tiếng Anh - Flashcard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; color: #333; }
        .container { width: 100%; max-width: 520px; text-align: center; }
        h1 { color: white; margin-bottom: 10px; font-size: 1.8rem; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }
        .subtitle { color: rgba(255, 255, 255, 0.8); margin-bottom: 25px; font-size: 0.95rem; }

        /* Giao diện Menu */
        #menu-view { background: rgba(255, 255, 255, 0.95); padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2); text-align: left; }
        .menu-section { margin-bottom: 20px; }
        .menu-section h2 { font-size: 1.1rem; color: #4c51bf; border-bottom: 2px solid #e2e8f0; padding-bottom: 5px; margin-bottom: 12px; }
        .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .menu-btn { background: #f7fafc; color: #2d3748; border: 1px solid #e2e8f0; padding: 12px; font-size: 0.9rem; font-weight: 600; border-radius: 10px; cursor: pointer; transition: all 0.2s; }
        .menu-btn:hover { background: #4c51bf; color: white; transform: translateY(-2px); }

        /* Giao diện Flashcard */
        #flashcard-view { display: none; }
        .card-container { perspective: 1000px; width: 100%; height: 260px; margin-bottom: 25px; }
        .card { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s; border-radius: 20px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2); cursor: pointer; }
        .card.flipped { transform: rotateY(180deg); }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 20px; padding: 20px; background: white; }
        .card-back { background: #f8f9fa; transform: rotateY(180deg); }
        .word { font-size: 2.2rem; font-weight: bold; color: #2d3748; }
        .meaning { font-size: 1.6rem; color: #4a5568; margin-bottom: 10px; }
        .example { font-size: 1rem; color: #718096; font-style: italic; }
        .hint { position: absolute; bottom: 15px; font-size: 0.8rem; color: #a0aec0; }

        .controls { display: flex; gap: 12px; justify-content: center; margin-bottom: 20px; }
        button { background: white; color: #4c51bf; border: none; padding: 12px 20px; font-size: 0.95rem; font-weight: 600; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-back-menu { background: #e2e8f0; color: #4a5568; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Flashcard Từ Vựng</h1>
        <div class="subtitle" id="current-topic-title">Chọn chủ đề để bắt đầu</div>

        <div id="menu-view">
            <button class="menu-btn" onclick="selectTopic('giadinh.txt', 'Gia đình')">👪 Gia đình</button>
            <button class="menu-btn" onclick="selectTopic('anuong.txt', 'Ăn uống')">🍔 Ăn uống</button>
        </div>

        <div id="flashcard-view">
            <div class="card-container">
                <div class="card" id="card" onclick="flipCard()">
                    <div class="card-face card-front">
                        <div class="word" id="front-word">...</div>
                        <div class="hint">Chạm để xem nghĩa 🔄</div>
                    </div>
                    <div class="card-face card-back">
                        <div class="meaning" id="back-meaning">...</div>
                        <div class="example" id="back-example"></div>
                        <div class="hint">Chạm để xem từ 🔄</div>
                    </div>
                </div>
            </div>
            <div class="controls">
                <button onclick="prevWord()">⬅ Trước</button>
                <button onclick="speakWord()">🔊 Phát âm</button>
                <button onclick="nextWord()">Tiếp ➡</button>
            </div>
            <div class="progress" id="progress" style="color:white; margin-bottom:10px;">0 / 0</div>
            <button class="btn-back-menu" onclick="backToMenu()">⬅ Quay lại Menu</button>
        </div>
    </div>

    <script>
        let vocabulary = [];
        let currentIndex = 0;
        const card = document.getElementById('card');

        function flipCard() { card.classList.toggle('flipped'); }

        function updateCard() {
            card.classList.remove('flipped');
            setTimeout(() => {
                const item = vocabulary[currentIndex];
                document.getElementById('front-word').innerText = item.word;
                document.getElementById('back-meaning').innerText = item.meaning;
                document.getElementById('back-example').innerText = item.example;
                document.getElementById('progress').innerText = `${currentIndex + 1} / ${vocabulary.length}`;
            }, 150);
        }

        function speakWord() {
            const utterance = new SpeechSynthesisUtterance(vocabulary[currentIndex].word);
            utterance.lang = 'en-US';
            window.speechSynthesis.speak(utterance);
        }

        function nextWord() { currentIndex = (currentIndex + 1) % vocabulary.length; updateCard(); }
        function prevWord() { currentIndex = (currentIndex - 1 + vocabulary.length) % vocabulary.length; updateCard(); }

        async function selectTopic(fileName, topicName) {
            document.getElementById('current-topic-title').innerText = `Chủ đề: ${topicName}`;
            try {
                const response = await fetch(fileName);
                const text = await response.text();
                vocabulary = text.split('\n').filter(l => l.trim() !== "").map(line => {
                    const [w, p, m, e] = line.split('-').map(s => s.trim());
                    return { word: w, meaning: m, example: e || "" };
                });
                document.getElementById('menu-view').style.display = 'none';
                document.getElementById('flashcard-view').style.display = 'block';
                updateCard();
            } catch (e) { alert("Không tìm thấy file!"); }
        }

        function backToMenu() {
            document.getElementById('flashcard-view').style.display = 'none';
            document.getElementById('menu-view').style.display = 'block';
        }
    </script>
</body>
</html>
