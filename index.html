<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiếng Anh - Flashcard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #027497 0%, #07405a 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #333;
        }
        .container {
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        h1 {
            color: white;
            margin-bottom: 20px;
            font-size: 1.8rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        /* Thẻ Flashcard với hiệu ứng 3D Lật */
        .card-container {
            perspective: 1000px;
            width: 100%;
            height: 260px;
            margin-bottom: 25px;
            cursor: pointer;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            padding: 20px;
            background: white;
        }

        .card-front {
            background: #ffffff;
        }

        .card-back {
            background: #f8f9fa;
            transform: rotateY(180deg);
        }

        .word {
            font-size: 2.2rem;
            font-weight: bold;
            color: #2d3748;
            margin-bottom: 10px;
        }

        .meaning {
            font-size: 1.6rem;
            color: #4a5568;
            margin-bottom: 10px;
        }

        .phonetic {
            font-size: 1.1rem;
            color: #718096;
            font-style: italic;
        }

        .hint {
            position: absolute;
            bottom: 15px;
            font-size: 0.85rem;
            color: #a0aec0;
        }

        /* Nút bấm điều hướng */
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 20px;
        }

        button {
            background: white;
            color: #bfa44c;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        button:active {
            transform: translateY(0);
        }

        .progress {
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.95rem;
            font-weight: 500;
        }

        /* Khu vực chọn/tải file */
        .file-upload-container {
            margin-top: 15px;
            background: rgba(255, 255, 255, 0.15);
            padding: 12px;
            border-radius: 12px;
            backdrop-filter: blur(5px);
        }

        .file-upload-label {
            color: white;
            font-size: 0.85rem;
            display: block;
            margin-bottom: 8px;
        }

        input[type="file"] {
            color: white;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Flashcard Từ Vựng</h1>

        <!-- Thẻ Flashcard -->
        <div class="card-container" onclick="flipCard()">
            <div class="card" id="card">
                <div class="card-face card-front">
                    <div class="word" id="front-word">Loading...</div>
                    <div class="phonetic" id="front-phonetic"></div>
                    <div class="hint">Chạm để xem nghĩa</div>
                </div>
                <div class="card-face card-back">
                    <div class="meaning" id="back-meaning">...</div>
                    <div class="hint">Chạm để xem từ</div>
                </div>
            </div>
        </div>

        <!-- Điều hướng -->
        <div class="controls">
            <button onclick="prevWord()">⬅ Trước</button>
            <button onclick="speakWord()">🔊 Phát âm</button>
            <button onclick="nextWord()">Tiếp ➡</button>
        </div>

        <!-- Tiến độ -->
        <div class="progress" id="progress">Đang tải từ vựng...</div>

        <!-- Tải file thủ công (phòng trường hợp xem trực tiếp không dùng server) -->
        <div class="file-upload-container">
            <span class="file-upload-label">Hoặc chọn file file `world.txt` của bạn:</span>
            <input type="file" id="fileInput" accept=".txt" onchange="loadFromFile(event)">
        </div>
    </div>

    <script>// Danh sách từ gốc (chỉ cần chứa từ tiếng Anh)
let wordList = ["apple", "vocabulary", "remember", "beautiful", "computer"]; 
let vocabulary = []; // Nơi lưu trữ thông tin chi tiết lấy từ API
let currentIndex = 0;
const card = document.getElementById('card');

// 1. Hàm gọi API để lấy chi tiết của từ
async function fetchWordDetails(word) {
    try {
        const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word.trim()}`);
        if (!response.ok) throw new Error('Không tìm thấy từ');
        
        const data = await response.json();
        const wordData = data[0];

        // Lấy phiên âm
        const phonetic = wordData.phonetic || (wordData.phonetics && wordData.phonetics[0] ? wordData.phonetics[0].text : '');
        
        // Lấy nghĩa tiếng Anh đầu tiên tìm thấy
        const meaning = wordData.meanings[0].definitions[0].definition;

        // Lấy file âm thanh bản xứ từ API (nếu có)
        let audioUrl = '';
        const audioObj = wordData.phonetics.find(p => p.audio && p.audio !== '');
        if (audioObj) {
            audioUrl = audioObj.audio;
        }

        return {
            word: wordData.word,
            phonetic: phonetic || '/.../',
            meaning: meaning,
            audio: audioUrl
        };
    } catch (error) {
        // Nếu API lỗi hoặc không tìm thấy từ, trả về thông tin cơ bản tạm thời
        return {
            word: word,
            phonetic: 'N/A',
            meaning: 'Không tìm thấy định nghĩa trực tuyến.',
            audio: ''
        };
    }
}

// 2. Phát âm (Ưu tiên file âm thanh thực tế từ API, nếu không có thì dùng giọng đọc AI của trình duyệt)
function speakWord() {
    if (vocabulary.length === 0) return;
    const current = vocabulary[currentIndex];

    if (current.audio) {
        const audio = new Audio(current.audio);
        audio.play().catch(() => {
            // Backup nếu trình duyệt chặn tự động phát audio
            speakWithSpeechSynthesis(current.word);
        });
    } else {
        speakWithSpeechSynthesis(current.word);
    }
}

function speakWithSpeechSynthesis(text) {
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US';
    window.speechSynthesis.speak(utterance);
}

// 3. Hiển thị từ hiện tại và tự động tải chi tiết từ API nếu chưa có
async function showCurrentWord() {
    card.classList.remove('flipped');
    document.getElementById('progress').innerText = `Đang tải chi tiết từ ${currentIndex + 1}/${wordList.length}...`;

    const currentWord = wordList[currentIndex];

    // Nếu từ này chưa được tải chi tiết từ API bao giờ, tiến hành tải
    if (!vocabulary[currentIndex]) {
        document.getElementById('front-word').innerText = "Loading...";
        document.getElementById('front-phonetic').innerText = "";
        document.getElementById('back-meaning').innerText = "Loading...";

        const details = await fetchWordDetails(currentWord);
        vocabulary[currentIndex] = details;
    }

    // Hiển thị lên giao diện
    const item = vocabulary[currentIndex];
    document.getElementById('front-word').innerText = item.word;
    document.getElementById('front-phonetic').innerText = item.phonetic;
    document.getElementById('back-meaning').innerText = item.meaning;
    document.getElementById('progress').innerText = `Từ ${currentIndex + 1} / ${wordList.length}`;
}

// 4. Các nút điều hướng
function nextWord() {
    if (wordList.length === 0) return;
    currentIndex = (currentIndex + 1) % wordList.length;
    showCurrentWord();
}

function prevWord() {
    if (wordList.length === 0) return;
    currentIndex = (currentIndex - 1 + wordList.length) % wordList.length;
    showCurrentWord();
}

function flipCard() {
    card.classList.toggle('flipped');
}

// 5. Xử lý khi nạp file world.txt (Mỗi dòng chỉ cần ghi 1 từ tiếng Anh)
function parseTextToVocab(text) {
    const lines = text.split('\n');
    const parsed = [];

    lines.forEach(line => {
        const trimmed = line.trim();
        if (trimmed) {
            // Lấy từ đầu tiên trước dấu gạch ngang (nếu file có nghĩa sẵn), hoặc lấy cả dòng
            const word = trimmed.split('-')[0].trim();
            parsed.push(word);
        }
    });

    if (parsed.length > 0) {
        wordList = parsed;
        vocabulary = []; // Reset dữ liệu API cũ
        currentIndex = 0;
        showCurrentWord();
    }
}

// Tự động tải file world.txt khi load trang
async function loadDefaultFile() {
    try {
        let response = await fetch('world.txt');
        if (!response.ok) response = await fetch('words.txt');
        
        if (response.ok) {
            const text = await response.text();
            parseTextToVocab(text);
        } else {
            showCurrentWord();
        }
    } catch (e) {
        showCurrentWord();
    }
}

function loadFromFile(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
        parseTextToVocab(e.target.result);
    };
    reader.readAsText(file);
}

window.onload = loadDefaultFile;
    </script>
</body>
</html>
