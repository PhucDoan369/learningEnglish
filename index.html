<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học Từ Vựng Tiếng Anh - Flashcard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #333;
        }

        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            color: white;
            margin-bottom: 20px;
            font-size: 1.8rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        /* Giao diện MENU */
        #menu-view {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: left;
        }

        .menu-section {
            margin-bottom: 20px;
        }

        .menu-section h3 {
            color: #4c51bf;
            font-size: 1.1rem;
            margin-bottom: 10px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 5px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .menu-grid.single-col {
            grid-template-columns: 1fr;
        }

        .menu-btn {
            background: #f7fafc;
            color: #2d3748;
            border: 1px solid #e2e8f0;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 500;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        .menu-btn:hover {
            background: #4c51bf;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .menu-btn.primary {
            background: #ebf4ff;
            color: #2b6cb0;
            border: 1px solid #bee3f8;
            font-weight: bold;
        }
        .menu-btn.primary:hover {
            background: #2b6cb0;
            color: white;
        }

        /* Giao diện FLASHCARD (Ẩn mặc định) */
        #flashcard-view {
            display: none;
        }

        .back-to-menu {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255,255,255,0.4);
            padding: 8px 16px;
            font-size: 0.9rem;
            border-radius: 8px;
            margin-bottom: 15px;
            display: inline-block;
            cursor: pointer;
            transition: all 0.2s;
        }
        .back-to-menu:hover {
            background: white;
            color: #4c51bf;
        }

        .card-container {
            perspective: 1000px;
            width: 100%;
            height: 260px;
            margin-bottom: 25px;
            cursor: pointer;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            padding: 20px;
            background: white;
        }

        .card-front { background: #ffffff; }
        .card-back {
            background: #f8f9fa;
            transform: rotateY(180deg);
        }

        .word {
            font-size: 2.2rem;
            font-weight: bold;
            color: #2d3748;
            margin-bottom: 10px;
        }

        .meaning {
            font-size: 1.6rem;
            color: #4a5568;
            margin-bottom: 10px;
        }

        .phonetic {
            font-size: 1.1rem;
            color: #718096;
            font-style: italic;
        }

        .hint {
            position: absolute;
            bottom: 15px;
            font-size: 0.85rem;
            color: #a0aec0;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .controls button {
            background: white;
            color: #4c51bf;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
        }

        .controls button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        .progress {
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.95rem;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="menu-view">
            <h2 style="text-align: center; color: #2d3748; margin-bottom: 20px;">Chọn Chủ Đề Học</h2>
            
            <div class="menu-section">
                <h3>1. Từ vựng quan trọng</h3>
                <div class="menu-grid single-col">
                    <button class="menu-btn primary" onclick="loadTopic('daily')">⭐ Từ vựng thông dụng hằng ngày</button>
                </div>
            </div>

            <div class="menu-section">
                <h3>2. Từ vựng theo chủ đề</h3>
                <div class="menu-grid">
                    <button class="menu-btn" onclick="loadTopic('it')">💻 Công nghệ TT</button>
                    <button class="menu-btn" onclick="loadTopic('vehicles')">🚗 Xe cộ</button>
                    <button class="menu-btn" onclick="loadTopic('travel')">✈️ Du lịch</button>
                    <button class="menu-btn" onclick="loadTopic('medical')">🏥 Y học</button>
                    <button class="menu-btn" onclick="loadTopic('law')">⚖️ Pháp luật</button>
                    <button class="menu-btn" onclick="loadTopic('business')">💼 Kinh doanh</button>
                    <button class="menu-btn" onclick="loadTopic('sports')">⚽ Thể thao</button>
                    <button class="menu-btn" onclick="loadTopic('finance')">💵 Tài chính</button>
                </div>
            </div>

            <div class="menu-section">
                <h3>3. Từ vựng nâng cao theo trình độ</h3>
                <div class="menu-grid">
                    <button class="menu-btn" onclick="loadTopic('easy')">🟢 Easy (A1–A2)</button>
                    <button class="menu-btn" onclick="loadTopic('medium')">🟡 Medium (B1–B2)</button>
                    <button class="menu-btn" style="grid-column: span 2;" onclick="loadTopic('hard')">🔴 Hard (C1)</button>
                </div>
            </div>
        </div>

        <div id="flashcard-view">
            <button class="back-to-menu" onclick="showMenu()">⬅ Quay lại Menu</button>
            <h1 id="topic-title">Flashcard</h1>

            <div class="card-container" onclick="flipCard()">
                <div class="card" id="card">
                    <div class="card-face card-front">
                        <div class="word" id="front-word">Loading...</div>
                        <div class="phonetic" id="front-phonetic"></div>
                        <div class="hint">Chạm để xem nghĩa 🔄</div>
                    </div>
                    <div class="card-face card-back">
                        <div class="meaning" id="back-meaning">...</div>
                        <div class="hint">Chạm để xem từ 🔄</div>
                    </div>
                </div>
            </div>

            <div class="controls">
                <button onclick="prevWord()">⬅ Trước</button>
                <button onclick="speakWord()">🔊 Phát âm</button>
                <button onclick="nextWord()">Tiếp ➡</button>
            </div>

            <div class="progress" id="progress">0 / 0</div>
        </div>
    </div>

    <script>
        // CẤU HÌNH ĐƯỜNG DẪN TÊN FILE .TXT TƯƠNG ỨNG TỪNG MỤC Ở ĐÂY
        const menuFiles = {
            'daily': 'daily.txt',
            'it': 'it.txt',
            'vehicles': 'vehicles.txt',
            'travel': 'travel.txt',
            'medical': 'medical.txt',
            'law': 'law.txt',
            'business': 'business.txt',
            'sports': 'sports.txt',
            'finance': 'finance.txt',
            'easy': 'easy.txt',
            'medium': 'medium.txt',
            'hard': 'hard.txt'
        };

        // Từ vựng dự phòng mặc định (Tránh lỗi nếu file trống hoặc lỗi fetch)
        let vocabulary = [{ word: "No data", phonetic: "", meaning: "Vui lòng kiểm tra file nguồn" }];
        let currentIndex = 0;
        const card = document.getElementById('card');

        // Hàm chuyển đổi giao diện sang Flashcard và tải file tương ứng
        async function loadTopic(topicKey) {
            const fileName = menuFiles[topicKey];
            document.getElementById('front-word').innerText = "Đang tải dữ liệu...";
            
            // Hiện Flashcard, ẩn Menu
            document.getElementById('menu-view').style.display = 'none';
            document.getElementById('flashcard-view').style.display = 'block';

            try {
                const response = await fetch(fileName);
                if (!response.ok) throw new Error("Không tìm thấy file");
                
                const text = await response.text();
                parseTextToVocab(text);
            } catch (error) {
                alert(`Không thể tải file "${fileName}". Hãy chắc chắn rằng bạn đang chạy trên Live Server và file có tồn tại.`);
                // Quay lại menu nếu lỗi
                showMenu();
            }
        }

        // Quay lại màn hình Menu
        function showMenu() {
            document.getElementById('flashcard-view').style.display = 'none';
            document.getElementById('menu-view').style.display = 'block';
        }

        // Phân tách nội dung file .txt thành mảng Object dữ liệu
        function parseTextToVocab(text) {
            const lines = text.split('\n');
            const parsed = [];

            lines.forEach(line => {
                const trimmed = line.trim();
                if (!trimmed) return;

                const parts = trimmed.split('-').map(p => p.trim());
                if (parts.length >= 2) {
                    if (parts.length === 2) {
                        parsed.push({ word: parts[0], phonetic: '', meaning: parts[1] });
                    } else {
                        parsed.push({ word: parts[0], phonetic: parts[1], meaning: parts[2] });
                    }
                }
            });

            if (parsed.length > 0) {
                vocabulary = parsed;
            } else {
                vocabulary = [{ word: "File rỗng", phonetic: "", meaning: "File không chứa đúng định dạng Từ - Nghĩa" }];
            }
            currentIndex = 0;
            updateCard();
        }

        // Điều khiển Flashcard
        function speakWord() {
            if (vocabulary.length === 0) return;
            const text = vocabulary[currentIndex].word;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            window.speechSynthesis.speak(utterance);
        }

        function flipCard() { card.classList.toggle('flipped'); }

        function updateCard() {
            card.classList.remove('flipped');
            setTimeout(() => {
                if (vocabulary.length > 0) {
                    const item = vocabulary[currentIndex];
                    document.getElementById('front-word').innerText = item.word;
                    document.getElementById('front-phonetic').innerText = item.phonetic || '';
                    document.getElementById('back-meaning').innerText = item.meaning;
                    document.getElementById('progress').innerText = `Từ ${currentIndex + 1} / ${vocabulary.length}`;
                }
            }, 150);
        }

        function nextWord() {
            currentIndex = (currentIndex + 1) % vocabulary.length;
            updateCard();
        }

        function prevWord() {
            currentIndex = (currentIndex - 1 + vocabulary.length) % vocabulary.length;
            updateCard();
        }
    </script>
</body>
</html>
